name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "**/*.{ts,tsx}"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
