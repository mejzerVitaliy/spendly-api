steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - "--no-cache"
      - "-t"
      - >-
        $_AR_DOCKER_IMAGE_URI:latest
      - .
      - "-f"
      - Dockerfile

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - >-
        $_AR_DOCKER_IMAGE_URI:latest

  # min-instances=1 (always-on, 24/7-billed CPU+memory reservation) traded
  # cold starts for a real, continuous cost - it was the single biggest line
  # item on the Cloud Run bill. Back to 0 here; ScheduleKeepWarm below pings
  # /ping every 4 minutes instead, which keeps the container warm for real
  # traffic almost all of the time at a tiny fraction of the cost (a few
  # hundred trivial requests/day, well inside Cloud Run's free tier) rather
  # than paying for a guaranteed 24/7 reservation. Not a 100% guarantee the
  # way min-instances was - a request can still land during the rare window
  # right after Cloud Run recycles an instance - but it covers the vast
  # majority of real traffic for close to free. If a cold start ever becomes
  # unacceptable again, min-instances=1 is the fallback, at that cost.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: Deploy
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud run services update $_SERVICE_NAME \
          --platform=managed \
          --image=$_AR_DOCKER_IMAGE_URI:latest \
          --region=$_DEPLOY_REGION \
          --timeout=300 \
          --cpu-boost \
          --max-instances=10 \
          --min-instances=0 \
          --set-env-vars=NODE_ENV=production,APPLICATION_URL=$_APPLICATION_URL,FRONTEND_URL=$_FRONTEND_URL \
          --set-secrets=APPLICATION_SECRET=projects/207624620631/secrets/dev-application-secret:latest,RESEND_API_KEY=projects/207624620631/secrets/dev-spendly-api-resend_api_key:latest,OPENAI_API_KEY=projects/207624620631/secrets/dev-spendly-api-openai_api_key:latest,CLOUDINARY_CLOUD_NAME=projects/207624620631/secrets/dev-spendly-api-cloudinary_cloud_name:latest,CLOUDINARY_API_KEY=projects/207624620631/secrets/dev-spendly-api-cloudinary_api_key:latest,CLOUDINARY_API_SECRET=projects/207624620631/secrets/dev-spendly-api-cloudinary_api_secret:latest,DATABASE_URL=projects/207624620631/secrets/dev-spendly-db-database_url:latest,CRON_SECRET=projects/207624620631/secrets/dev-spendly-api-cron_secret:latest,ANALYTICS_ADMIN_SECRET=projects/207624620631/secrets/dev-spendly-api-analytics_admin_secret:latest \
          --quiet

  # The recurring-transactions job used to run via an in-process node-cron
  # scheduler, which never fires reliably on Cloud Run - min-instances=0 means
  # the container is usually asleep at the scheduled time. POST /cron/recurring
  # already exists and is CRON_SECRET-authenticated for exactly this; this step
  # makes sure a Cloud Scheduler job is actually calling it (create on first
  # deploy, update on every deploy after, in case the URL/schedule changes).
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: ScheduleRecurringCron
    waitFor: ["Deploy"]
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        if gcloud scheduler jobs describe spendly-recurring-cron --location=$_DEPLOY_REGION >/dev/null 2>&1; then
          gcloud scheduler jobs update http spendly-recurring-cron \
            --location=$_DEPLOY_REGION \
            --schedule="5 0 * * *" \
            --time-zone="Etc/UTC" \
            --uri="$_APPLICATION_URL/cron/recurring" \
            --http-method=POST \
            --update-headers="Authorization=Bearer $$CRON_SECRET" \
            --quiet
        else
          gcloud scheduler jobs create http spendly-recurring-cron \
            --location=$_DEPLOY_REGION \
            --schedule="5 0 * * *" \
            --time-zone="Etc/UTC" \
            --uri="$_APPLICATION_URL/cron/recurring" \
            --http-method=POST \
            --headers="Authorization=Bearer $$CRON_SECRET" \
            --quiet
        fi
    secretEnv: ["CRON_SECRET"]

  # Same pattern as ScheduleRecurringCron above, for the daily re-engagement
  # push dispatch (streak/inactivity/weekly/monthly - see
  # notification-dispatch.service.ts). 9:00 UTC is a single fixed time with
  # no per-user timezone awareness - a deliberate scope cut, not an oversight.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: ScheduleNotificationDispatch
    waitFor: ["Deploy"]
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        if gcloud scheduler jobs describe spendly-notification-dispatch --location=$_DEPLOY_REGION >/dev/null 2>&1; then
          gcloud scheduler jobs update http spendly-notification-dispatch \
            --location=$_DEPLOY_REGION \
            --schedule="0 9 * * *" \
            --time-zone="Etc/UTC" \
            --uri="$_APPLICATION_URL/cron/notifications" \
            --http-method=POST \
            --update-headers="Authorization=Bearer $$CRON_SECRET" \
            --quiet
        else
          gcloud scheduler jobs create http spendly-notification-dispatch \
            --location=$_DEPLOY_REGION \
            --schedule="0 9 * * *" \
            --time-zone="Etc/UTC" \
            --uri="$_APPLICATION_URL/cron/notifications" \
            --http-method=POST \
            --headers="Authorization=Bearer $$CRON_SECRET" \
            --quiet
        fi
    secretEnv: ["CRON_SECRET"]

  # Keep-warm ping, see the comment on min-instances in Deploy above. /ping
  # is unauthenticated and does no DB/work, so no CRON_SECRET needed here.
  # Every 4 minutes comfortably beats Cloud Run's (undocumented, observed
  # ~15min) idle scale-down window, so the container is almost always warm
  # for real requests without paying for a 24/7 reservation.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: ScheduleKeepWarm
    waitFor: ["Deploy"]
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        if gcloud scheduler jobs describe spendly-keep-warm --location=$_DEPLOY_REGION >/dev/null 2>&1; then
          gcloud scheduler jobs update http spendly-keep-warm \
            --location=$_DEPLOY_REGION \
            --schedule="*/4 * * * *" \
            --time-zone="Etc/UTC" \
            --uri="$_APPLICATION_URL/ping" \
            --http-method=GET \
            --quiet
        else
          gcloud scheduler jobs create http spendly-keep-warm \
            --location=$_DEPLOY_REGION \
            --schedule="*/4 * * * *" \
            --time-zone="Etc/UTC" \
            --uri="$_APPLICATION_URL/ping" \
            --http-method=GET \
            --quiet
        fi

  - name: "gcr.io/cloud-builders/docker"
    id: start-cloudsql-proxy
    waitFor: ["Deploy"]
    entrypoint: bash
    args:
      - "-c"
      - |
        docker run -d --name gce-cloudsql-proxy --user root --network cloudbuild \
          --volume /workspace/cloudsql:/cloudsql \
          gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14-alpine \
          --unix-socket /cloudsql --run-connection-test \
          tokyo-hydra-464314-a0:europe-central2:dev-spendly-db

  - name: "gcr.io/cloud-builders/docker"
    id: check-cloudsql-logs
    waitFor: ["start-cloudsql-proxy"]
    entrypoint: bash
    args:
      - "-c"
      - |
        sleep 10
        docker logs gce-cloudsql-proxy || true
        ls -la /workspace/cloudsql/ || true

  - name: "node:22"
    id: install-dependencies
    waitFor: ["Deploy"]
    entrypoint: npm
    args: ["ci"]

  - name: "node:22"
    id: SeedDatabase
    waitFor: ["check-cloudsql-logs", "install-dependencies"]
    entrypoint: bash
    args:
      - "-c"
      - |
        ln -sf /workspace/cloudsql /cloudsql
        npm run prisma:generate
        npm run prisma:seed
    secretEnv: ["DATABASE_URL"]

images:
  - "$_AR_DOCKER_IMAGE_URI:latest"

availableSecrets:
  secretManager:
    - versionName: projects/207624620631/secrets/dev-spendly-db-seed_database_url/versions/latest
      env: DATABASE_URL
    - versionName: projects/207624620631/secrets/dev-spendly-api-cron_secret/versions/latest
      env: CRON_SECRET

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

tags:
  - gcp-cloud-build-deploy-cloud-run